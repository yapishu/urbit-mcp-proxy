<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Proxy</title>
  <link rel="stylesheet" href="/apps/mcp-proxy/css/app.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>MCP Proxy</h1>
      <p class="subtitle">Configure remote MCP server routes for LLMs</p>
    </header>
    <main>
      <section id="endpoint-section">
        <h2>MCP Endpoint</h2>
        <p class="endpoint-desc">All configured servers are accessible at this endpoint.</p>
        <div class="endpoint-row">
          <span class="endpoint-label">URL</span>
          <code class="endpoint-url" id="agg-url" onclick="App.copyUrl(this.textContent)"></code>
        </div>
        <div class="endpoint-row">
          <span class="endpoint-label">Header</span>
          <code class="endpoint-url" id="agg-cookie" onclick="App.copyUrl(this.textContent)"></code>
        </div>
        <div class="endpoint-example" id="endpoint-example"></div>
      </section>
      <section id="add-server">
        <h2>Add Server</h2>
        <form id="add-form">
          <div class="form-row">
            <label>ID
              <input type="text" name="id" placeholder="my-server" pattern="[a-z][a-z0-9]*(-[a-z0-9]+)*" title="lowercase letters, digits, hyphens" required>
            </label>
            <label>Name
              <input type="text" name="name" placeholder="My MCP Server" required>
            </label>
          </div>
          <div class="form-row">
            <label>Mode
              <select name="mode" id="add-mode" onchange="App.toggleSchemaUrl('add')">
                <option value="proxy">Proxy (MCP Server)</option>
                <option value="openapi">OpenAPI (REST API)</option>
              </select>
            </label>
            <label>OAuth Provider
              <select name="oauth-provider" id="add-oauth-select" class="oauth-select"><option value="">None</option></select>
            </label>
          </div>
          <div class="form-row">
            <label>URL
              <input type="url" name="url" id="add-url" placeholder="https://example.com/mcp" required>
              <span class="field-hint" id="add-url-hint">Upstream MCP server endpoint</span>
            </label>
          </div>
          <div class="form-row" id="add-schema-row" style="display:none">
            <label>Schema URL
              <input type="url" name="schema-url" placeholder="https://api.example.com/openapi.json">
              <span class="field-hint">OpenAPI spec URL (JSON)</span>
            </label>
          </div>
          <div>
            <span class="label-text">Headers</span>
            <div id="add-headers"></div>
          </div>
          <div class="form-actions">
            <button type="button" class="secondary" onclick="App.addHeaderRow(document.getElementById('add-headers'))">+ Header</button>
            <button type="submit">Add Server</button>
          </div>
        </form>
      </section>
      <section id="servers-section">
        <h2>Configured Servers</h2>
        <div id="servers"></div>
      </section>
      <section id="oauth-section">
        <h2>OAuth Providers</h2>
        <div id="oauth-providers"></div>
        <details class="oauth-add-details">
          <summary>Add OAuth Provider</summary>
          <form id="oauth-add-form">
            <div class="form-row">
              <label>ID <input type="text" name="id" placeholder="x" pattern="[a-z][a-z0-9]*(-[a-z0-9]+)*" required></label>
              <label>Client ID <input type="text" name="client-id" required></label>
            </div>
            <div class="form-row">
              <label>Client Secret <input type="password" name="client-secret" required></label>
            </div>
            <div class="form-row">
              <label>Auth URL <input type="url" name="auth-url" required></label>
              <label>Token URL <input type="url" name="token-url" required></label>
            </div>
            <div class="form-row">
              <label>Revoke URL <input type="url" name="revoke-url"></label>
              <label>Redirect URI <input type="url" name="redirect-uri" required></label>
            </div>
            <div class="form-row">
              <label>Scopes <input type="text" name="scopes" placeholder="read write"></label>
            </div>
            <div class="form-actions">
              <button type="submit">Add Provider</button>
            </div>
          </form>
        </details>
      </section>
    </main>
  </div>
  <script src="/apps/mcp-proxy/js/api.js"></script>
  <script src="/apps/mcp-proxy/js/app.js"></script>
</body>
</html>
